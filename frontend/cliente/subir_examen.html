<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Subir Examen</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#eeeeee;
color:#333;
}

.header{
height:70px;
display:flex;
align-items:center;
padding:0 30px;
}

.back{
width:40px;
height:40px;
background:#0b7d0b;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:20px;
}

.main{
width:80%;
margin:30px auto;
display:flex;
gap:40px;
}

.left{
width:50%;
}

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:#f5f7fb;
border-radius:14px;
padding:28px;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
}

.card h2{
font-size:26px;
margin-bottom:20px;
font-weight:600;
}

.form-group{
margin-bottom:18px;
}

label{
font-size:14px;
margin-bottom:6px;
display:block;
font-weight:500;
}

input,select,textarea{
width:100%;
padding:10px;
border-radius:6px;
border:1px solid #bcd9bc;
font-size:14px;
outline:none;
}

textarea{
height:90px;
resize:none;
}

input:focus,select:focus,textarea:focus{
border:1px solid #0b7d0b;
}

.upload-box{
border:2px dashed #0b7d0b;
border-radius:10px;
padding:30px;
text-align:center;
margin-top:10px;
background:#f9fbff;
}

.upload-icon{
font-size:30px;
color:#3c6fb6;
margin-bottom:10px;
}

.upload-box p{
font-size:13px;
color:#666;
margin-bottom:5px;
}

.file-btn{
margin-top:10px;
background:#0b7d0b;
color:#fff;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:600;
box-shadow:0 3px 6px rgba(0,0,0,0.2);
}

.formats{
margin-top:15px;
font-size:13px;
color:#666;
}

.formats span{
margin-right:15px;
font-weight:600;
color:#333;
}

.preview-card{
width:90%;
height:420px;
background:#fff;
border-radius:14px;
box-shadow:0 3px 8px rgba(0,0,0,0.15);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.preview-img{
width:70%;
height:200px;
background:#e5e5e5;
border-radius:10px;
margin-bottom:20px;
display:flex;
align-items:center;
justify-content:center;
color:#bbb;
font-size:14px;
}

.preview-text{
color:#0b7d0b;
font-weight:600;
font-size:16px;
}

</style>
</head>

<body>

<header class="header">
    <a href="gestion_citas_usuarios.html">
      <div class="back">↩</div>  
    </a>
</header>

<main class="main">

<div class="left">

<div class="card">

<h2>Subir Examen Cuántico</h2>

<div class="form-group">
<label>Título del Examen</label>
<input type="text" placeholder="Introduce el título de tu examen">
</div>

<div class="form-group">
<label>Descripción Breve</label>
<textarea placeholder="Una breve descripción sobre el contenido o el objetivo del examen..."></textarea>
</div>

<div class="form-group">
<label>Materia o Área Cuántica</label>
<select>
<option>Selecciona una materia</option>
</select>
</div>

<div class="form-group">
<label>Subir Archivo</label>

<div class="upload-box">
<div class="upload-icon">⤴</div>
<p>Arrastra y suelta tu archivo aquí, o haz clic para seleccionar.</p>
<p>Ningún archivo seleccionado</p>
<button class="file-btn">Seleccionar Archivo</button>
</div>

<div class="formats">
Formatos permitidos:
<br><br>
<span>PDF</span>
<span>Word</span>
<span>JPG</span>
<span>PNG</span>
<span>SVG</span>
</div>

</div>

</div>

</div>

<div class="right">

<div class="preview-card">
<div class="preview-img">Vista previa</div>
<div class="preview-text">Impulsa tu aprendizaje cuántico</div>
</div>

</div>

</main>

</body>
</html>
