<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Contraseña</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f3f3f3;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.contenedor{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card-recuperar{
    width:760px;
    background:#fff;
    border-radius:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    padding:55px;
}

.encabezado{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.titulo{
    font-size:54px;
    font-weight:700;
    color:#222;
    line-height:1.1;
}

.logo-bienestar{
    display:flex;
    align-items:center;
    gap:12px;
    color:#138a12;
    font-size:28px;
    font-weight:500;
    white-space:nowrap;
}

.icono{
    width:42px;
    height:42px;
    border:3px solid #138a12;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
}

.linea{
    margin:35px 0;
    border:none;
    border-top:2px solid #e4e4e4;
}

.formulario label{
    display:block;
    font-size:25px;
    font-weight:500;
    color:#333;
    margin-bottom:12px;
}

.formulario input{
    width:100%;
    height:68px;
    border:2px solid #222;
    border-radius:8px;
    padding:0 20px;
    font-size:22px;
}

.formulario input:focus{
    outline:none;
}

.descripcion{
    margin-top:20px;
    font-size:24px;
    line-height:1.5;
    color:#444;
}

.btn-enviar{
    margin-top:40px;
    width:100%;
    height:72px;
    border:none;
    border-radius:8px;
    background:#008a00;
    color:#fff;
    font-size:25px;
    font-weight:600;
    transition:.3s;
}

.btn-enviar:hover{
    background:#006d00;
}

@media(max-width:900px){

.card-recuperar{
    width:95%;
    padding:30px;
}

.encabezado{
    flex-direction:column;
}

.titulo{
    font-size:38px;
}

.logo-bienestar{
    font-size:18px;
}

.formulario label{
    font-size:20px;
}

.formulario input{
    font-size:18px;
}

.descripcion{
    font-size:18px;
}

.btn-enviar{
    font-size:20px;
}

}

</style>

</head>
<body>

<div class="contenedor">

<div class="card-recuperar">

<div class="encabezado">

<h1 class="titulo">
Recupera tu<br>
contraseña
</h1>

<div class="logo-bienestar">
<div class="icono">✓</div>
<div>
Cuidamos tu<br>
bienestar digital
</div>
</div>

</div>

<hr class="linea">

<div class="formulario">

<label>Correo electrónico</label>

<input
type="email"
placeholder="tu_correo@ejemplo.com">

<p class="descripcion">
Te enviaremos un correo electrónico con instrucciones para restablecer tu contraseña.
</p>

<button class="btn-enviar">
Enviar código
</button>

</div>

</div>

</div>

</body>
</html>
