<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural One Life - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:650px;
    background:white;
    padding:60px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    font-size:55px;
    font-weight:bold;
    color:#222;
    margin-bottom:25px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:60px;
    font-size:20px;
}

label{
    display:block;
    margin-bottom:10px;
    margin-top:20px;
    font-size:20px;
}

input{
    width:100%;
    height:60px;
    border:1px solid #555;
    border-radius:8px;
    padding-left:15px;
    font-size:18px;
}

button{
    width:100%;
    height:60px;
    margin-top:30px;
    background:#008a00;
    color:white;
    border:none;
    border-radius:8px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.links{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
}

.links a{
    text-decoration:none;
    color:#6a35ff;
    font-size:18px;
}

</style>

</head>
<body>

<div class="login-container">

    <h1>Bienvenido a Natural One Life</h1>

    <p class="subtitle">Gracias por elegirnos</p>

   <form action="index.html">

    <label>Correo electrónico</label>
    <input type="email"
           placeholder="tu.correo@ejemplo.com"
           required>

    <label>Contraseña</label>
    <input type="password"
           placeholder="********"
           required>

    <button type="submit">
        Iniciar sesión
    </button>

    <div class="links">
        <a href="recuperar-contraseña.html">
            ¿Olvidaste tu contraseña?
        </a>

        <a href="registro.html">
            Registro/Crear cuenta
        </a>
    </div>

</form>

</div>

</body>
</html>
