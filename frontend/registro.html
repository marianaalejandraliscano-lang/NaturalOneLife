<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{
width:900px;
background:#fff;
padding:50px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1{
text-align:center;
font-size:55px;
color:#222;
margin-bottom:20px;
}

.subtitle{
font-size:20px;
margin-bottom:30px;
color:#444;
}

.row{
display:flex;
gap:20px;
margin-bottom:20px;
}

.col{
flex:1;
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
color:#333;
}

input{
width:100%;
height:55px;
padding:10px;
border:1px solid #555;
border-radius:8px;
font-size:16px;
}

.full{
margin-bottom:20px;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin:15px 0;
}

.checkbox input{
width:auto;
height:auto;
}

button{
width:100%;
height:60px;
background:#008a00;
color:#fff;
border:none;
border-radius:8px;
font-size:22px;
font-weight:bold;
cursor:pointer;
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

</style>

</head>
<body>

<div class="container">

<h1>Crear Cuenta</h1>

<p class="subtitle">
Completa el formulario para registrarte en la plataforma Natural One Life.
</p>

<form>

<div class="row">

<div class="col">
<label>Nombre</label>
<input type="text" placeholder="Ingresa tu nombre">
</div>

<div class="col">
<label>Apellidos</label>
<input type="text" placeholder="Ingresa tus apellidos">
</div>

</div>

<div class="full">
<label>Email Corporativo (opcional)</label>
<input type="email" placeholder="tu.nombre@empresa.com">
</div>

<div class="row">

<div class="col">
<label>Nombre de Usuario</label>
<input type="text" placeholder="crea_tu_usuario">
</div>

<div class="col">
<label>Cargo</label>
<input type="text" placeholder="Ej. Gerente de Proyectos">
</div>

</div>

<div class="row">

<div class="col">
<label>Contraseña</label>
<input type="password" placeholder="********">
</div>

<div class="col">
<label>Confirmar Contraseña</label>
<input type="password" placeholder="********">
</div>

</div>

<div class="checkbox">
<input type="checkbox">
<span>Acepto los términos y condiciones</span>
</div>

<button type="button" onclick="registrar()">
    Registrar
</button>

<script>
function registrar(){
    alert("Usuario registrado correctamente");
    window.location.href="login.html";
}
</script>
</form>

</div>

</body>
</html>
